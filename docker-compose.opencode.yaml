---
name: opencode-dmr-va # Project Name must be lowercase

networks:
  local-llm-net:
    external: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.177.0/24

services:
  opencode_va:
    image: "ghcr.io/anomalyco/opencode:latest"
    container_name: "opencode-va-local"
    user: "${USER_ID}:${GROUP_ID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "America/New_York"
      HOME: "/home/awesome/opencode"
      OPENCODE_CONFIG: "/home/awesome/oc-config/opencode.jsonc"
      OPENCODE_TUI_CONFIG: "/home/awesome/oc-config/tui.jsonc"
      OPENCODE_CONFIG_DIR: "/home/awesome/oc-config/global"
      OPENCODE_EXPERIMENTAL_LSP_TOOL: true
      OC_PROJECT_NAME: ${OC_PROJECT_NAME}
    volumes:
      - source: "."
        target: "/workspace"
        type: bind
      - source: "${HOME}/OpenCode/opencode-container/${OC_PROJECT_NAME}/"
        target: "/home/awesome/opencode/"
        type: bind
      - source: "${HOME}/OpenCode/opencode.jsonc"
        target: "/home/awesome/oc-config/opencode.jsonc"
        type: bind
      - source: "${HOME}/OpenCode/tui.jsonc"
        target: "/home/awesome/oc-config/tui.jsonc"
        type: bind
      - source: "${HOME}/OpenCode/config-global/"
        target: "/home/awesome/oc-config/global/"
        type: bind
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      local-llm-net:
        ipv4_address: "192.168.177.10"
    models:
      llm_gptoss:
        endpoint_var: MODEL_URL

models:
  llm_gptoss:
    model: ai/gpt-oss:20B-F16
    context_size: 131072
