services:
  opencode:
    models:
      llm_active:
        endpoint_var: ACTIVE_MODEL_URL
        model_var: ACTIVE_MODEL_NAME
    environment:
      ACTIVE_MODEL_DISPLAY_NAME: "Mistral 3.5 128B"

models:
  llm_active:
    model: huggingface.co/unsloth/mistral-medium-3.5-128b-gguf
    runtime_flags:
      - "--temp"
      - "0.7"
      - "--top-p"
      - "0.95"
      # - "--reasoning_effort"
      # - "high"
