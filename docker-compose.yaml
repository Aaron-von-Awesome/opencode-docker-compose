---
name: opencode-va # Project Name must be lowercase

networks:
  opencode-net:
    external: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.177.0/24

services:
  opencode:
    image: "local/${DIRECTORY_ID:-iocane}/opencode:latest-stable"
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    # Private in-process server: the shared background service registers in
    # ~/.local/state/opencode/service.json (shared via dot-local), so parallel
    # containers would keep replacing each other's service.
    command: ["opencode", "--standalone"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "primeradiant.com:127.0.0.1" # Disable Super Powers Skill beacon
    volumes:
      - "${WORKSPACE_DIR:-.}:/home/abc/${OC_PROJECT_NAME:-workspace}"
      - "./dot-config/:/home/abc/.config/"
      - "./dot-local/:/home/abc/.local/"
      - "./dot-cache/:/home/abc/.cache/"
      - "./dot-npm/:/home/abc/.npm/"
      - "./dot-ssh/:/home/abc/.ssh/"
      - "./dot-gitconfig/.gitconfig:/home/abc/.gitconfig"
      # - "./development/:/home/abc/development/"  # optional: additional global folder
      # - "./container-tmp/:/tmp/"  # optional: add tmp/ as persistent storage
    working_dir: "/home/abc/${OC_PROJECT_NAME:-workspace}"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      # Host TZ if the launching shell exports one, else the documented default.
      TZ: "${TZ:-America/New_York}"
      OC_PROJECT_NAME: "${OC_PROJECT_NAME}"
      TERM: "xterm-256color"
      OPENCODE_DISABLE_FREE_MODELS: "1"
      # ------------------------------
      # Custom Plugin Settings
      # ------------------------------
      PONYTAIL_DEFAULT_MODE: "off"
      SUPERPOWERS_DISABLE_TELEMETRY: "1"
    # Checks only that `opencode` is running, so it works in every mode.
    # start_period covers OpenCode's first-run database migration.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x opencode >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      opencode-net:

# No model backend is defined here. `opencode-run.sh --model <shortname>`
# merges one models/<backend>/<shortname>.yaml overlay: for llama.cpp (cpp)
# plus docker-compose.llama-cpp.yaml; for Docker Model Runner (dmr) the
# overlay carries a single `models:` binding so DMR loads one model at a time.
