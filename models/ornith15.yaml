services:
  opencode:
    models:
      llm_active:
        endpoint_var: ACTIVE_MODEL_URL
        model_var: ACTIVE_MODEL_NAME
    environment:
      ACTIVE_MODEL_DISPLAY_NAME: "Ornith 1.5 A3B 35B"

models:
  llm_active:
    model: ai/ornith-1.5:35b-a3b-q4_K_M
    runtime_flags:
      # For precise coding tasks:
      - "--temp"
      - "0.7" # 0.6
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--min-p"
      - "0.00"
      - "--presence-penalty"
      - "0.0"
      - "--repeat-penalty"
      - "1.0"
      - "--ctx-size"
      - "128000"
      # Custom
      # - "--temp"
      # - "0.9"
      # - "--top-p"
      # - "0.95"
      # - "--top-k"
      # - "20"
      # - "--min-p"
      # - "0.00"
      # - "--presence-penalty"
      # - "1.0"
      # - "--repeat-penalty"
      # - "1.0"
      # - "--ctx-size"
      # - "128000"
      # For general tasks:
