---
name: opencode-va # Project Name must be lowercase

networks:
  opencode-net:
    external: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.177.0/24

services:
  opencode:
    image: "local/${DIRECTORY_ID:-iocane}/opencode:latest-stable"
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - "${WORKSPACE_DIR:-.}:/home/abc/${OC_PROJECT_NAME:-workspace}"
      - "${HOME}/OpenCode/dot-config:/home/abc/.config"
      - "${HOME}/OpenCode/dot-local:/home/abc/.local"
      - "${HOME}/OpenCode/dot-cache:/home/abc/.cache"
      - "${HOME}/OpenCode/dot-npm:/home/abc/.npm"
      - "${HOME}/OpenCode/dot-ssh/:/home/abc/.ssh/"
      - "${HOME}/OpenCode/dot-gitconfig/.gitconfig:/home/abc/.gitconfig"
    working_dir: "/home/abc/${OC_PROJECT_NAME:-workspace}"
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "America/New_York"
      OPENCODE_EXPERIMENTAL_LSP_TOOL: true
      OC_PROJECT_NAME: "${OC_PROJECT_NAME}"
      TERM: "xterm-256color"
      # Custom Plugin Settings
      PONYTAIL_DEFAULT_MODE: "off"
    # Healthcheck for the OpenCode service itself (independent of the
    # Docker Model Runner backend container, which has its own healthcheck
    # we cannot configure from here). We check that the `opencode` process
    # is running inside the container — works in both local-model and
    # cloud/third-party modes since it doesn't depend on any model-related
    # env vars. The 60s start_period covers OpenCode's first-run database
    # migration; steady-state checks then run every 30s.
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x opencode >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      opencode-net:
        ipv4_address: "192.168.177.10"

# Model bindings are intentionally NOT defined here. Each model lives in its
# own overlay file under `models/` and is selected at runtime via
# `opencode-run.sh --model <shortname>`. This ensures only one model is
# declared per service start, so Docker Model Runner only ever loads one
# model into memory at a time.
