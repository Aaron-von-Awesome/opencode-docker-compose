# Merged by llama-cpp-run.sh on top of docker-compose.llama-cpp.yaml and one
# models/cpp/<shortname>.yaml, as its own compose project (llama-cpp-standalone).
services:
  llama-server:
    container_name: llama-server-standalone
    restart: unless-stopped
    ports:
      - "${LLAMA_BIND:-0.0.0.0}:${LLAMA_PORT:-8080}:8080"
    environment:
      # No value: passed through only when the launching shell has one set.
      # Name is the contract with llama.cpp (--api-key reads LLAMA_API_KEY
      # and ignores any LLAMA_ARG_* variant), so don't rename this.
      LLAMA_API_KEY:

networks:
  opencode-net:
