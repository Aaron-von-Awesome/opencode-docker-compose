services:
  opencode:
    models:
      llm_active:
        endpoint_var: ACTIVE_MODEL_URL
        model_var: ACTIVE_MODEL_NAME
    environment:
      ACTIVE_MODEL_DISPLAY_NAME: "Devstral Small 2"

models:
  llm_active:
    model: ai/devstral-small-2
    runtime_flags:
      - "--temp"
      - "0.7"
      - "--top-p"
      - "0.95"
