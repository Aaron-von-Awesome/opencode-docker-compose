services:
  opencode:
    models:
      llm_active:
        endpoint_var: ACTIVE_MODEL_URL
        model_var: ACTIVE_MODEL_NAME
    environment:
      ACTIVE_MODEL_DISPLAY_NAME: "Ornith 1.5 A3B 35B"

models:
  llm_active:
    model: ai/ornith-1.5:35b-a3b-q4_K_M
    runtime_flags:
      - "--temp"
      - "0.6"
      - "--top-p"
      - "0.95"
      - "--top-k"
      - "20"
      - "--ctx-size"
      - "262144"
      - "--spec-type"
      - "draft-mtp"
      - "--parallel"
      - "1"
      - "--spec-draft-n-max"
      - "2"
