services:
  opencode:
    image: "local/${DIRECTORY_ID:-iocane}/opencode:latest-stable"
    build:
      context: .
      dockerfile: Dockerfile
    stdin_open: true
    tty: true
    volumes:
      - "${WORKSPACE_DIR:-.}:/home/abc/${OC_PROJECT_NAME:-workspace}"
      - "${HOME}/OpenCode/dot-opencode:/home/abc/OpenCode/dot-opencode"
      - "${HOME}/OpenCode/dot-opencode-json/opencode.jsonc:/home/abc/OpenCode/dot-opencode-json/opencode.jsonc"
      - "${HOME}/OpenCode/dot-opencode-json/tui.jsonc:/home/abc/OpenCode/dot-opencode-json/tui.jsonc"
      - "${HOME}/OpenCode/dot-local:/home/abc/.local"
      - "${HOME}/OpenCode/dot-cache:/home/abc/.cache"
      - "${HOME}/OpenCode/dot-npm:/home/abc/.npm"
      - "${HOME}/OpenCode/dot-ssh/:/home/abc/.ssh/"
      - "${HOME}/OpenCode/dot-gitconfig/.gitconfig:/home/abc/.gitconfig"
    working_dir: "/home/abc/${OC_PROJECT_NAME:-workspace}"
    environment:
      TZ: "America/New_York"
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      OC_PROJECT_NAME: "${OC_PROJECT_NAME}"
      OPENCODE_CONFIG_DIR: "/home/abc/OpenCode/dot-opencode"
      OPENCODE_CONFIG: "/home/abc/OpenCode/dot-opencode-json/opencode.jsonc"
      OPENCODE_EXPERIMENTAL_LSP_TOOL: true
      OPENCODE_TUI_CONFIG: "/home/abc/OpenCode/dot-opencode-json/tui.jsonc"
      TERM: "xterm-256color"
    models:
      llm_gpt20oss:
        endpoint_var: GPT20_MODEL_URL
        model_var: GPT20_MODEL_NAME
      llm_gpt120oss:
        endpoint_var: GPT120_MODEL_URL
        model_var: GPT120_MODEL_NAME

models:
  llm_gpt20oss:
    model: ai/gpt-oss:20B-F16
  llm_gpt120oss:
    model: huggingface.co/unsloth/gpt-oss-120b-gguf:F16
