---
name: opencode-dmr-va # Project Name must be lowercase

networks:
  local-llm-net:
    external: false
    enable_ipv6: false
    ipam:
      config:
        - subnet: 192.168.177.0/24

services:
  opencode_va:
    image: "ghcr.io/anomalyco/opencode:latest"
    container_name: "opencode-va-local"
    user: "${USER_ID}:${GROUP_ID}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: "America/New_York"
      HOME: "/home/awesome/opencode"
      OPENCODE_CONFIG: "/home/awesome/oc-config/opencode.jsonc"
      OPENCODE_TUI_CONFIG: "/home/awesome/oc-config/tui.jsonc"
      OPENCODE_CONFIG_DIR: "/home/awesome/oc-config/global"
      OPENCODE_EXPERIMENTAL_LSP_TOOL: true
      OC_PROJECT_NAME: ${OC_PROJECT_NAME}
    volumes:
      - source: "."
        target: "/workspace"
        type: bind
      - source: "${HOME}/OpenCode/opencode-container/${OC_PROJECT_NAME}/"
        target: "/home/awesome/opencode/"
        type: bind
      - source: "${HOME}/OpenCode/opencode.jsonc"
        target: "/home/awesome/oc-config/opencode.jsonc"
        type: bind
      - source: "${HOME}/OpenCode/tui.jsonc"
        target: "/home/awesome/oc-config/tui.jsonc"
        type: bind
      - source: "${HOME}/OpenCode/config-global/"
        target: "/home/awesome/oc-config/global/"
        type: bind
    working_dir: /workspace
    stdin_open: true
    tty: true
    restart: unless-stopped
    # To serve up a Web UI
    # Uncomment "ports" section and run this command:
    #   oc web --hostname 0.0.0.0 --port 4096
    # ports:
    #  - "127.0.0.1:4096:4069"
    networks:
      local-llm-net:
        ipv4_address: "192.168.177.10"
    models:
      llm_gpt20oss:
        endpoint_var: GPT20_MODEL_URL
        model_var: GPT20_MODEL_NAME
      llm_gpt120oss:
        endpoint_var: GPT120_MODEL_URL
        model_var: GPT120_MODEL_NAME
      llm_gemma4_31b:
        endpoint_var: GEMMA4_31_MODEL_URL
        model_var: GEMMA4_31_MODEL_NAME

models:
  llm_gpt20oss:
    model: ai/gpt-oss:20B-F16
  # llm_gpt120oss:
  #   model: huggingface.co/unsloth/gpt-oss-120b-gguf:F16
  # llm_gemma4_31b:
  #   model: huggingface.co/google/gemma-4-31b-it
